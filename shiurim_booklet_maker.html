<style>
:root {
  --gold:        #c8a96e;
  --gold-light:  #e8cc8e;
  --gold-dark:   #8a6a3e;
  --gold-dim:    rgba(200,169,110,0.15);
  --gold-border: rgba(200,169,110,0.2);
  --night:       #060a14;
  --navy:        #0b1020;
  --panel:       rgba(255,255,255,0.04);
  --panel-hover: rgba(255,255,255,0.065);
  --cream:       #f0e8d8;
  --cream-dim:   rgba(240,232,216,0.55);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Frank Ruhl Libre', serif;
  background: var(--night);
  color: var(--cream);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Atmospheric background */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 40%, rgba(200,169,110,0.04) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 85% 20%, rgba(80,110,200,0.05) 0%, transparent 70%),
    radial-gradient(ellipse 70% 40% at 50% 90%, rgba(40,60,140,0.06) 0%, transparent 70%);
  pointer-events: none; z-index: 0;
}

/* Subtle noise texture */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0; opacity: 0.4;
}

/* ─── Glass System ─────────────────────────────────── */
.glass {
  background: var(--panel);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  border: 1px solid var(--gold-border);
}
.glass-strong {
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(32px) saturate(1.6);
  -webkit-backdrop-filter: blur(32px) saturate(1.6);
  border: 1px solid rgba(200,169,110,0.28);
  box-shadow: 0 8px 40px rgba(0,0,0,0.4);
}

/* ─── Gold Typography ──────────────────────────────── */
.gold-text {
  background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 40%, var(--gold-light) 70%, var(--gold) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.gold-rule { border-color: var(--gold-border); }

/* ─── Upload Zone ──────────────────────────────────── */
#upload-zone {
  border: 2px dashed rgba(200,169,110,0.25);
  transition: border-color 0.3s, background 0.3s;
  cursor: pointer;
}
#upload-zone:hover, #upload-zone.drag-over {
  border-color: var(--gold);
  background: rgba(200,169,110,0.04);
}

/* ─── Day Buttons ──────────────────────────────────── */
.day-btn {
  border: 1px solid var(--gold-border);
  background: var(--panel);
  backdrop-filter: blur(12px);
  border-radius: 12px;
  padding: 10px 4px;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
}
.day-btn:hover { border-color: rgba(200,169,110,0.5); background: rgba(200,169,110,0.06); }
.day-btn.active {
  border-color: var(--gold);
  background: rgba(200,169,110,0.12);
  box-shadow: 0 0 20px rgba(200,169,110,0.12), inset 0 1px 0 rgba(200,169,110,0.15);
}
.day-btn .day-num { font-size: 10px; color: rgba(200,169,110,0.5); display: block; margin-bottom: 3px; }
.day-btn .day-he  { font-size: 12px; line-height: 1.3; }
.day-btn.active .day-he { color: var(--gold); }

/* ─── Rambam Toggle ─────────────────────────────────── */
.toggle-opt {
  border: 1px solid var(--gold-border);
  background: var(--panel);
  border-radius: 10px;
  padding: 7px 14px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--cream-dim);
}
.toggle-opt:hover { border-color: rgba(200,169,110,0.4); color: var(--cream); }
.toggle-opt.active { border-color: var(--gold); background: rgba(200,169,110,0.14); color: var(--gold); }

/* ─── Tab Bar ───────────────────────────────────────── */
.tab-btn {
  padding: 14px 28px;
  font-size: 13px;
  letter-spacing: 0.04em;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  color: var(--cream-dim);
  background: none;
  border-top: none; border-left: none; border-right: none;
}
.tab-btn:hover { color: var(--cream); }
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

/* ─── Checkbox ──────────────────────────────────────── */
.cb {
  width: 17px; height: 17px;
  border: 1.5px solid rgba(200,169,110,0.35);
  border-radius: 4px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  cursor: pointer;
}
.cb.checked   { background: var(--gold); border-color: var(--gold); }
.cb.partial   { background: rgba(200,169,110,0.22); border-color: var(--gold); }
.cb:hover     { border-color: var(--gold); }

/* ─── Section Items ─────────────────────────────────── */
.sec-item {
  border-radius: 10px;
  padding: 9px 12px;
  display: flex; align-items: center; gap: 10px;
  cursor: pointer;
  transition: background 0.15s;
  user-select: none;
}
.sec-item:hover { background: rgba(255,255,255,0.04); }

/* ─── Assemble Button ───────────────────────────────── */
#assemble-btn {
  background: linear-gradient(120deg, var(--gold-dark), var(--gold) 45%, var(--gold-light) 70%, var(--gold));
  background-size: 250% 250%;
  animation: aurum 4s ease infinite;
  color: #08100e;
  font-family: 'Frank Ruhl Libre', serif;
  font-weight: 700;
  font-size: 15px;
  border-radius: 14px;
  padding: 12px 28px;
  cursor: pointer;
  border: none;
  transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
  letter-spacing: 0.03em;
}
#assemble-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 10px 36px rgba(200,169,110,0.3);
}
#assemble-btn:disabled { opacity: 0.3; cursor: not-allowed; animation: none; }
@keyframes aurum {
  0%   { background-position:   0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position:   0% 50%; }
}

/* ─── Loader ────────────────────────────────────────── */
#loader {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(6,10,20,0.88);
  backdrop-filter: blur(12px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.spinner {
  width: 52px; height: 52px;
  border: 3px solid rgba(200,169,110,0.12);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.85s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Scroller ─────────────────────────────────────────── */
@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

.animate-float {
    animation: float 2s ease-in-out infinite;
}

.glass-scroller {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
}

.scroll-container {
    transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s ease;
}

.scroll-hidden {
    opacity: 0;
    transform: translate(-50%, 20px);
    visibility: hidden;
    pointer-events: none;
}

/* ─── Toast ─────────────────────────────────────────── */
#toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  z-index: 200;
  padding: 10px 22px; border-radius: 50px;
  font-size: 13px; color: var(--gold);
  transition: opacity 0.4s;
  white-space: nowrap;
  pointer-events: none;
}

/* ─── Scrollbar ─────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(200,169,110,0.18); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(200,169,110,0.36); }

/* ─── Utilities ─────────────────────────────────────── */
.rtl { direction: rtl; text-align: right; }
.ltr { direction: ltr; text-align: left; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-up { animation: fadeUp 0.5s ease both; }

.section-badge {
  font-size: 10px; padding: 2px 8px; border-radius: 999px;
  background: rgba(200,169,110,0.1); color: rgba(200,169,110,0.7);
  border: 1px solid rgba(200,169,110,0.15);
  white-space: nowrap;
}

/* ─── Tree collapse arrow ─────────────────────────── */
.tree-arrow {
  width: 16px; height: 16px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: rgba(200,169,110,0.4);
  transition: transform 0.2s;
  cursor: pointer;
  border-radius: 4px;
}
.tree-arrow:hover { color: var(--gold); background: rgba(200,169,110,0.08); }
.tree-arrow.collapsed { transform: rotate(-90deg); }

/* Back Button Style */
.back-nav {
    position: fixed;
    top: 1.5rem;
    left: 1.5rem;
    z-index: 50;
}

.back-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: #121212;
    border: 1px solid #262626;
    color: #737373;
    transition: all 0.2s;
}

.back-btn:hover {
    background: #1a1a1a;
    color: #ededed;
    border-color: #404040;
    transform: translateX(-2px);
}
</style>
</head>

  <!-- ════════════ LANDING ════════════ -->
  <div id="upload-section" class="max-w-2xl mx-auto mb-8 fade-up" style="animation-delay:0.08s;">
    <div class="glass rounded-2xl p-6">
      <div id="landing-card" style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;">

          <!-- Outer glow -->

          <!-- Frame border with corner ornaments -->

            <div style="position:absolute;top:2px;right:2px;width:12px;height:12px;border-top:1.5px solid var(--gold);border-right:1.5px solid var(--gold);border-radius:0 2px 0 0;opacity:0.7;"></div>
            <div style="position:absolute;bottom:2px;left:2px;width:12px;height:12px;border-bottom:1.5px solid var(--gold);border-left:1.5px solid var(--gold);border-radius:0 0 0 2px;opacity:0.7;"></div>

          <h2 style="font-family:'Cormorant Garamond',serif;font-size:clamp(1.4rem,4vw,2rem);font-weight:400;color:var(--cream);line-height:1.2;margin-bottom:16px;">דבר מלכות</h2>

<script>

   PDF.js worker

  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ══════════════════════════════════════════════════════════
   Constants
══════════════════════════════════════════════════════════ */
const DAYS_SHORT = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DAYS_NUMS  = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','שבת'];

// Full day names as they appear in PDF outlines
const DAY_NAMES_HE = [
  'יום ראשון','יום שני','יום שלישי','יום רביעי','יום חמישי','יום שישי',
  'שבת','שבת קודש'
];

// Parent sections for auto-selection in basic view
const AUTO_PARENTS = ['חומש יומי','תניא יומי','היום יום'];
const RAMBAM_KEYWORDS = ['רמב"ם','רמב׳ם',"רמב'ם",'רמבם','רמב'];
const RAMBAM_3_KEYWORDS = ['ג׳','ג\'','ג פרקים','שלשה','שלושה','3'];
const RAMBAM_1_KEYWORDS = ['פרק','פרק א','1 פרק','אחד'];

// NOTE: CHASLAT_VARIANTS, KNOWN_DAY_PARENTS, ICON_MARKER, and GB_PAD_ICON
// used to live here, but they're only used by the PDF-analysis algorithm,
// which has been extracted to shared/booklet-logic.js (dynamically loaded
// only when the precomputed-data fast path misses — see processPdfBytes).

/* ══════════════════════════════════════════════════════════
   State
══════════════════════════════════════════════════════════ */
const S = {
  pdfBytes:       null,
  remotePdfBytes: null,
  pdfJsDoc:       null,
  totalPages:     0,
  sections:       [],
  selectedIds:    new Set(),
  activeTab:           'basic',
  selDays:             new Set(),
  rambam:              '3',
  hayomYomPageMap:     {},   // dayLabel → Set of 1-based page numbers (from gray-box scan)
  hayomYomSelectedPages: new Set(), // 1-based pages to include from היום יום
};

const REMOTE_URL = 'https://scrape-dm.hamshachos.dev';

/* ══════════════════════════════════════════════════════════
   Bootstrap
══════════════════════════════════════════════════════════ */
(function boot() {

/* ══════════════════════════════════════════════════════════
   File input (fallback)
══════════════════════════════════════════════════════════ */
function setupFileInput() {
  const input = document.getElementById('file-input');

    const f = e.target.files[0];
    if (f) handleFile(f);
  });

/* ══════════════════════════════════════════════════════════
   Fetch remote PDF & render first-page preview
══════════════════════════════════════════════════════════ */
async function fetchRemotePreview() {
  try {
    const res = await fetch(REMOTE_URL, { mode: 'cors', credentials: 'omit' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const buf = await res.arrayBuffer();
    S.remotePdfBytes = new Uint8Array(buf);

    // Render page 1 to an OFF-SCREEN canvas at 2× for sharpness
    const doc    = await pdfjsLib.getDocument({ data: S.remotePdfBytes.slice() }).promise;
    const page   = await doc.getPage(1);
    const vp     = page.getViewport({ scale: 1 });
    const scale  = (140 * 2) / vp.width;
    const scaled = page.getViewport({ scale });

    const offscreen = document.createElement('canvas');
    offscreen.width  = scaled.width;
    offscreen.height = scaled.height;
    const ctx = offscreen.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, offscreen.width, offscreen.height);
    await page.render({ canvasContext: ctx, viewport: scaled }).promise;

    const dataUrl = offscreen.toDataURL('image/jpeg', 0.92);
    const img = document.getElementById('pdf-preview-img');
    img.src = dataUrl;
    img.style.display = 'block';
    document.getElementById('preview-skeleton').style.display = 'none';

  } catch (err) {
    console.warn('Preview fetch failed:', err);
    showPreviewPlaceholder();
  }
}

function showPreviewPlaceholder() {
  document.getElementById('preview-skeleton').innerHTML = `
    <div style="text-align:center;padding:16px 10px;">
      <div style="font-size:28px;margin-bottom:8px;opacity:0.4;">📄</div>
      <p style="font-size:10px;color:rgba(200,169,110,0.5);line-height:1.5;">תצוגה מקדימה<br>אינה זמינה</p>
    </div>`;
}

/* ══════════════════════════════════════════════════════════
   Load the remote PDF (fetch now if preview pre-fetch failed)
══════════════════════════════════════════════════════════ */
async function loadRemotePDF() {
  if (S.remotePdfBytes) {
    await processPdfBytes(S.remotePdfBytes, 'דבר מלכות');
    return;
  }
  showLoader('מוריד קובץ…', REMOTE_URL);
  try {
    const res = await fetch(REMOTE_URL, { mode: 'cors', credentials: 'omit' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const buf = await res.arrayBuffer();
    S.remotePdfBytes = new Uint8Array(buf);
    hideLoader();
    await processPdfBytes(S.remotePdfBytes, 'דבר מלכות');
  } catch (err) {
    hideLoader();
    showToast(`שגיאת רשת: ${err.message} — נסה להעלות קובץ ידנית`);
  }
}

/* ══════════════════════════════════════════════════════════
   Handle uploaded file (fallback)
══════════════════════════════════════════════════════════ */
async function handleFile(file) {
  const buf = await file.arrayBuffer();
  await processPdfBytes(new Uint8Array(buf), file.name);
}

/* ══════════════════════════════════════════════════════════
   Precomputed-data fast path
   The shared PDF-analysis algorithm (outline extraction, end-page rules,
   the gray-box engine) lives in shared/booklet-logic.js, hosted alongside
   a precomputed data.json in the companion GitHub repo. A scheduled
   GitHub Action computes both on a cron and commits them; that repo's
   GitHub Pages serves them as plain static files.

   Flow: hash whatever PDF bytes we actually have (remote or uploaded) and
   compare against the hash stored in the precomputed data.json.
     - Match  → hydrate S.sections / S.hayomYomPageMap / S.totalPages
       directly from the JSON. shared/booklet-logic.js is never fetched,
       and pdf.js never even opens the document — the bytes are only
       needed later for pdf-lib's assembly step.
     - Mismatch, or data.json/module unreachable → dynamically import
       shared/booklet-logic.js and compute everything in-browser, exactly
       as this tool always has. This is the safety net: the tool keeps
       working correctly even if the whole caching layer is down or stale.

   FILL IN before deploying: replace <PRECOMPUTED_REPO_BASE_URL> with the
   actual GitHub Pages URL of the companion repo, e.g.
   'https://yourusername.github.io/shiurim-booklet-data'
══════════════════════════════════════════════════════════ */
const PRECOMPUTED_BASE_URL   = '<PRECOMPUTED_REPO_BASE_URL>';
const PRECOMPUTED_DATA_URL   = `${PRECOMPUTED_BASE_URL}/data.json`;
const PRECOMPUTED_MODULE_URL = `${PRECOMPUTED_BASE_URL}/shared/booklet-logic.js`;

async function sha256Hex(bytes) {
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
}

// Populate S directly from a precomputed data.json payload — no pdf.js
// document is opened at all on this path.
function hydrateFromPrecomputed(data) {
  S.totalPages      = data.totalPages;
  S.sections        = data.sections;
  // Plain arrays here (not Sets) — every consumer (autoSelect) only
  // iterates this map with for..of, never calls Set-specific methods,
  // so arrays are a fully compatible substitute.
  S.hayomYomPageMap  = data.hayomYomPageMap;
}

/* ══════════════════════════════════════════════════════════
   Core: process raw PDF bytes
══════════════════════════════════════════════════════════ */
async function processPdfBytes(bytes, label) {
  showLoader('קורא קובץ PDF…', label);
  try {
    S.pdfBytes = bytes;
    let usedPrecomputed = false;

    try {
      setLoaderSub('בודק אם קיים חישוב מוכן מראש…');
      const pdfHash = await sha256Hex(S.pdfBytes);
      const res = await fetch(PRECOMPUTED_DATA_URL, { cache: 'no-store' });
      if (res.ok) {
        const precomputed = await res.json();
        if (precomputed.pdfHash === pdfHash) {
          hydrateFromPrecomputed(precomputed);
          usedPrecomputed = true;
        }
      }
    } catch (_) {
      // data.json unreachable, invalid, or hashing failed — fall through
      // to the full in-browser computation below. Not a fatal error.
    }

    if (!usedPrecomputed) {
      setLoaderSub('מחשב מקומית…');
      const { extractOutline, calculateEndPages, buildHayomYomPageMap } =
        await import(PRECOMPUTED_MODULE_URL);

      const pdfJsCopy = S.pdfBytes.slice();
      S.pdfJsDoc   = await pdfjsLib.getDocument({ data: pdfJsCopy }).promise;
      S.totalPages = S.pdfJsDoc.numPages;

      setLoaderSub(`${S.totalPages} עמודים — מחלץ כריכיות`);
      await extractOutline(S);
      setLoaderText('מחשב טווחי עמודים…');
      await calculateEndPages(S);
      setLoaderText('סורק היום יום…');
      setLoaderSub('מאתר קופסאות אפורות לפי יום');
      await buildHayomYomPageMap(S);
    }

    document.getElementById('upload-section').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    renderDayGrid();
    renderAdvancedTree();

    const jsDow = new Date().getDay();
    toggleDay(jsDow === 6 ? 6 : jsDow);

    hideLoader();
    showToast(`✓ נטען • ${S.sections.length} קטעים, ${S.totalPages} עמודים${usedPrecomputed ? ' (מחושב מראש)' : ''}`);
  } catch (err) {
    hideLoader();
    showToast('שגיאה: ' + err.message);
    console.error(err);
  }
}

/* ══════════════════════════════════════════════════════════
   UI – Day Grid
══════════════════════════════════════════════════════════ */
function renderDayGrid() {
  const grid = document.getElementById('day-grid');
  grid.innerHTML = '';
  DAYS_SHORT.forEach((day, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-btn';
    btn.id = `day-${i}`;
    btn.innerHTML = `<span class="day-num">${DAYS_NUMS[i]}</span><span class="day-he">${day}</span>`;
    btn.onclick = () => toggleDay(i);
    grid.appendChild(btn);
  });
}

function toggleDay(idx) {
  if (S.selDays.has(idx)) {
    S.selDays.delete(idx);
  } else {
    S.selDays.add(idx);
  }
  DAYS_SHORT.forEach((_, i) => {
    const b = document.getElementById(`day-${i}`);
    if (b) b.classList.toggle('active', S.selDays.has(i));
  });
  autoSelect();
}

/* ══════════════════════════════════════════════════════════
   UI – Rambam Toggle
══════════════════════════════════════════════════════════ */
function setRambam(mode) {
  S.rambam = mode;
  ['3','1','both'].forEach(m => {
    const el = document.getElementById('rambam-' + m);
    if (el) el.classList.toggle('active', m === mode);
  });
  if (S.selDays.size > 0) autoSelect();
}

/* ══════════════════════════════════════════════════════════
   Auto-Selection (Basic View)
══════════════════════════════════════════════════════════ */
function autoSelect() {
  S.selectedIds.clear();
  S.hayomYomSelectedPages = new Set();

  if (S.selDays.size === 0 || !S.sections.length) {
    renderBasicList();
    renderAdvancedTree();
    updateCounter();
    return;
  }

  // ── היום יום — gray-box page map (per selected day) ──
  for (const dayIdx of S.selDays) {
    const dayLabels = dayIdx === 6
      ? ['שבת', 'שבת קודש']
      : [`יום ${DAYS_SHORT[dayIdx]}`];

    for (const label of dayLabels) {
      const pages = S.hayomYomPageMap[label];
      if (pages) for (const p of pages) S.hayomYomSelectedPages.add(p);
    }
  }

  // ── Per-day sections (חומש יומי, תניא יומי) ──────────
  const DAY_PARENTS = ['חומש יומי', 'תניא יומי'];

  for (const dayIdx of S.selDays) {
    const dayLabel = dayIdx === 6
      ? ['שבת', 'שבת קודש']
      : [`יום ${DAYS_SHORT[dayIdx]}`];

    for (const parentName of DAY_PARENTS) {
      const parent = findSectionByTitle(parentName);
      if (!parent) continue;
      const children = getSectionChildren(parent.id);
      const match = children.find(c => dayLabel.some(d => matchesDay(c.title, d)));
      if (match) {
        S.selectedIds.add(match.id);
        selectDescendants(match.id);
      }
    }

    // ── Rambam ──────────────────────────────────────────
    selectRambamForDay(dayLabel);
  }

  renderBasicList();
  renderAdvancedTree();
  updateCounter();
}

function matchesDay(sectionTitle, dayLabel) {
  const s = sectionTitle.trim();
  const d = dayLabel.trim();
  return s === d || s.startsWith(d);
}

/* ══════════════════════════════════════════════════════════
   Finders & tree helpers
══════════════════════════════════════════════════════════ */
function findSectionByTitle(name) {
  return S.sections.find(s => s.title === name || s.title.includes(name));
}

function findAllByKeywords(keywords) {
  return S.sections.filter(s => keywords.some(k => s.title.includes(k)));
}

function getSectionChildren(parentId) {
  return S.sections.filter(s => s.parentId === parentId);
}

function selectDescendants(id) {
  for (const c of getSectionChildren(id)) {
    S.selectedIds.add(c.id);
    selectDescendants(c.id);
  }
}

function deselectDescendants(id) {
  for (const c of getSectionChildren(id)) {
    S.selectedIds.delete(c.id);
    deselectDescendants(c.id);
  }
}

/* ══════════════════════════════════════════════════════════
   Rambam selection – full-tree scoring strategy
══════════════════════════════════════════════════════════ */
function selectRambamForDay(dayLabels) {
  const candidates = findAllByKeywords(RAMBAM_KEYWORDS);
  if (!candidates.length) return;

  function score(sec) {
    let s = 0;
    const t = sec.title;
    if (S.rambam === '3') {
      if (RAMBAM_3_KEYWORDS.some(k => t.includes(k))) s += 2;
      if (RAMBAM_1_KEYWORDS.some(k => t.includes(k))) s -= 2;
    } else if (S.rambam === '1') {
      if (RAMBAM_1_KEYWORDS.some(k => t.includes(k))) s += 2;
      if (RAMBAM_3_KEYWORDS.some(k => t.includes(k))) s -= 2;
    }
    const kids = getSectionChildren(sec.id);
    if (kids.some(c => DAY_NAMES_HE.some(d => c.title.includes(d)))) s += 1;
    return s;
  }

  const scored = candidates
    .map(c => ({ sec: c, s: score(c) }))
    .sort((a, b) => b.s - a.s || a.sec.level - b.sec.level);

  const targets = S.rambam === 'both'
    ? scored.slice(0, 2).map(x => x.sec)
    : [scored[0].sec];

  for (const target of targets) {
    selectDayWithinSection(target, dayLabels);
  }
}

function selectDayWithinSection(sec, dayLabels, depth = 0) {
  if (depth > 3) return false;

  if (dayLabels.some(d => matchesDay(sec.title, d))) {
    S.selectedIds.add(sec.id);
    selectDescendants(sec.id);
    return true;
  }

  const kids = getSectionChildren(sec.id);
  const directMatch = kids.find(c => dayLabels.some(d => matchesDay(c.title, d)));
  if (directMatch) {
    S.selectedIds.add(directMatch.id);
    selectDescendants(directMatch.id);
    return true;
  }

  for (const kid of kids) {
    if (selectDayWithinSection(kid, dayLabels, depth + 1)) return true;
  }
  return false;
}

/* ══════════════════════════════════════════════════════════
   Render – Basic List
══════════════════════════════════════════════════════════ */
function renderBasicList() {
  const el = document.getElementById('basic-list');
  el.innerHTML = '';

  // ── היום יום row (gray-box driven) ───────────────────
  if (S.hayomYomSelectedPages && S.hayomYomSelectedPages.size > 0) {
    const sortedPgs = [...S.hayomYomSelectedPages].sort((a,b) => a-b);
    const pageMin   = sortedPgs[0];
    const pageMax   = sortedPgs[sortedPgs.length - 1];

    const row = document.createElement('div');
    row.className = 'sec-item';
    row.style.background = 'rgba(255,255,255,0.025)';
    row.style.border     = '1px solid rgba(200,169,110,0.08)';
    row.innerHTML = `
      <div style="width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;"></div>
      <div style="flex:1;direction:rtl;text-align:right;">
        <p style="font-size:14px;line-height:1.4;">היום יום</p>
        <p style="font-size:11px;color:var(--cream-dim);margin-top:1px;">${sortedPgs.length} עמודים</p>
      </div>
      <span class="section-badge ltr">${pageMin}–${pageMax}</span>
      <button onclick="removeHayomYom()" title="הסר" style="background:none;border:none;color:rgba(200,169,110,0.3);cursor:pointer;font-size:14px;padding:2px 4px;">×</button>
    `;
    el.appendChild(row);
  }

  // ── Outline-based sections ────────────────────────────
  const tops = S.sections
    .filter(s => {
      if (!S.selectedIds.has(s.id)) return false;
      if (s.startPage === null) return false;
      if (s.parentId !== null && S.selectedIds.has(s.parentId)) return false;
      return true;
    })
    .sort((a, b) => a.startPage - b.startPage);

  if (!tops.length && (!S.hayomYomSelectedPages || S.hayomYomSelectedPages.size === 0)) {
    el.innerHTML = `<p class="rtl" style="color:var(--cream-dim);font-size:13px;padding:14px 0;text-align:center;">אין קטעים נבחרים</p>`;
    return;
  }

  for (const sec of tops) {
    const allInSubtree = collectSubtreePages(sec.id);
    const pageMin = allInSubtree.length ? Math.min(...allInSubtree) + 1 : sec.startPage;
    const pageMax = allInSubtree.length ? Math.max(...allInSubtree) + 1 : (sec.endPage ?? sec.startPage);

    const row = document.createElement('div');
    row.className = 'sec-item';
    row.style.background = 'rgba(255,255,255,0.025)';
    row.style.border     = '1px solid rgba(200,169,110,0.08)';
    row.innerHTML = `
      <div style="width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;"></div>
      <div style="flex:1;direction:rtl;text-align:right;">
        <p style="font-size:14px;line-height:1.4;">${esc(sec.title)}</p>
        ${sec.parentTitle ? `<p style="font-size:11px;color:var(--cream-dim);margin-top:1px;">${esc(sec.parentTitle)}</p>` : ''}
      </div>
      <span class="section-badge ltr">${pageMin}–${pageMax}</span>
      <button onclick="toggleSection(${sec.id})" title="הסר" style="background:none;border:none;color:rgba(200,169,110,0.3);cursor:pointer;font-size:14px;padding:2px 4px;">×</button>
    `;
    el.appendChild(row);
  }
}

// Remove button handler for the היום יום gray-box row
function removeHayomYom() {
  S.hayomYomSelectedPages = new Set();
  renderBasicList();
  updateCounter();
}

function collectSubtreePages(id) {
  const pages = new Set();
  function walk(sid) {
    const s = S.sections.find(x => x.id === sid);
    if (!s || !S.selectedIds.has(sid)) return;
    if (s.startPage !== null) {
      const from = s.startPage - 1;
      const to   = Math.min((s.endPage ?? s.startPage) - 1, S.totalPages - 1);
      for (let p = from; p <= to; p++) pages.add(p);
    }
    for (const cid of (s.childIds || [])) walk(cid);
  }
  walk(id);
  return [...pages];
}

/* ══════════════════════════════════════════════════════════
   Render – Advanced Tree
══════════════════════════════════════════════════════════ */
function renderAdvancedTree() {
  const container = document.getElementById('adv-tree');
  container.innerHTML = '';
  const roots = S.sections.filter(s => s.parentId === null);
  for (const r of roots) buildTreeNode(container, r);
}

function buildTreeNode(parent, sec) {
  const hasKids = sec.childIds.length > 0;
  const isSel   = S.selectedIds.has(sec.id);
  const anyDesc = hasKids && anyDescendantSelected(sec.id);
  const allDesc = hasKids && allDescendantsSelected(sec.id);

  let cbClass = '';
  let cbInner = '';
  if (isSel || allDesc) {
    cbClass = 'checked';
    cbInner = `<svg width="9" height="7" viewBox="0 0 9 7" fill="none"><path d="M1 3.5L3.5 6L8 1" stroke="#08100e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  } else if (anyDesc) {
    cbClass = 'partial';
    cbInner = `<div style="width:7px;height:2px;background:var(--gold);border-radius:1px;"></div>`;
  }

  const depth = sec.level;
  const row   = document.createElement('div');
  row.className = 'sec-item';
  row.style.paddingRight = `${10 + depth * 18}px`;

  const arrow = document.createElement('span');
  arrow.className = `tree-arrow${sec.collapsed ? ' collapsed' : ''}`;
  arrow.innerHTML = hasKids ? '▾' : '';
  if (hasKids) {
    arrow.addEventListener('click', e => {
      e.stopPropagation();
      sec.collapsed = !sec.collapsed;
      renderAdvancedTree();
    });
  }

  const cb = document.createElement('div');
  cb.className = `cb ${cbClass}`;
  cb.innerHTML = cbInner;

  const title = document.createElement('div');
  title.style.cssText = 'flex:1;direction:rtl;text-align:right;';
  title.innerHTML = `<span style="font-size:${13 - depth * 0.5}px;color:${isSel || allDesc ? 'var(--cream)' : 'var(--cream-dim)'};">${esc(sec.title)}</span>`;

  const badge = document.createElement('span');
  badge.className = 'section-badge ltr';
  badge.style.fontSize = '10px';
  badge.textContent = sec.startPage ? `${sec.startPage}–${sec.endPage ?? '?'}` : '';

  row.appendChild(arrow);
  row.appendChild(cb);
  row.appendChild(title);
  row.appendChild(badge);

  row.addEventListener('click', () => toggleSection(sec.id));
  parent.appendChild(row);

  if (hasKids && !sec.collapsed) {
    const childWrap = document.createElement('div');
    for (const cid of sec.childIds) {
      const child = S.sections.find(s => s.id === cid);
      if (child) buildTreeNode(childWrap, child);
    }
    parent.appendChild(childWrap);
  }
}

function anyDescendantSelected(id) {
  for (const cid of (S.sections.find(s => s.id === id)?.childIds || [])) {
    if (S.selectedIds.has(cid) || anyDescendantSelected(cid)) return true;
  }
  return false;
}

function allDescendantsSelected(id) {
  const kids = S.sections.find(s => s.id === id)?.childIds || [];
  if (!kids.length) return false;
  return kids.every(cid => S.selectedIds.has(cid) && allDescendantsSelected(cid));
}

/* ══════════════════════════════════════════════════════════
   Toggle section
══════════════════════════════════════════════════════════ */
function toggleSection(id) {
  if (S.selectedIds.has(id)) {
    S.selectedIds.delete(id);
    deselectDescendants(id);
  } else {
    S.selectedIds.add(id);
    selectDescendants(id);
  }
  renderBasicList();
  renderAdvancedTree();
  updateCounter();
}

function selectAll() {
  S.sections.forEach(s => S.selectedIds.add(s.id));
  renderBasicList(); renderAdvancedTree(); updateCounter();
}

function deselectAll() {
  S.selectedIds.clear();
  renderBasicList(); renderAdvancedTree(); updateCounter();
}

/* ══════════════════════════════════════════════════════════
   Counter
══════════════════════════════════════════════════════════ */
function updateCounter() {
  const sel = S.sections.filter(s => S.selectedIds.has(s.id) && s.startPage !== null);
  const outlinePgs = sel.reduce((sum, s) => {
    return sum + Math.max(0, (s.endPage ?? s.startPage) - s.startPage + 1);
  }, 0);
  const hayomPgs = S.hayomYomSelectedPages ? S.hayomYomSelectedPages.size : 0;
  const totalPgs = outlinePgs + hayomPgs;
  const totalSecs = sel.length + (hayomPgs > 0 ? 1 : 0);
  document.getElementById('sel-count').textContent = `${totalSecs} קטעים נבחרו`;
  document.getElementById('sel-pages').textContent = `${totalPgs} עמודים`;
  document.getElementById('assemble-btn').disabled = totalSecs === 0;
}

/* ══════════════════════════════════════════════════════════
   Tabs
══════════════════════════════════════════════════════════ */
function switchTab(tab) {
  S.activeTab = tab;
  document.getElementById('view-basic').style.display    = tab === 'basic'    ? 'block' : 'none';
  document.getElementById('view-advanced').style.display = tab === 'advanced' ? 'block' : 'none';
  document.getElementById('tab-basic').classList.toggle('active',    tab === 'basic');
  document.getElementById('tab-advanced').classList.toggle('active', tab === 'advanced');
}

/* ══════════════════════════════════════════════════════════
   PDF Assembly
══════════════════════════════════════════════════════════ */
async function assemblePDF() {
  showLoader('מרכיב PDF…', 'אוסף קטעים נבחרים');

  try {
    const { PDFDocument } = PDFLib;

    const srcPdf = await PDFDocument.load(S.pdfBytes);
    const newPdf = await PDFDocument.create();

    const sel = S.sections
      .filter(s => S.selectedIds.has(s.id) && s.startPage !== null)
      .sort((a, b) => a.startPage - b.startPage);

    const seen  = new Set();
    const pages = [];

    for (const sec of sel) {
      const from = sec.startPage - 1;
      const to   = Math.min((sec.endPage ?? sec.startPage) - 1, S.totalPages - 1);
      for (let p = from; p <= to; p++) {
        if (!seen.has(p)) { seen.add(p); pages.push(p); }
      }
    }

    // Add היום יום pages from the gray-box page map
    for (const p1 of (S.hayomYomSelectedPages || [])) {
      const p0 = p1 - 1; // convert to 0-based
      if (!seen.has(p0)) { seen.add(p0); pages.push(p0); }
    }

    pages.sort((a, b) => a - b);

    const BATCH = 20;
    for (let i = 0; i < pages.length; i += BATCH) {
      const batch = pages.slice(i, i + BATCH);
      const copied = await newPdf.copyPages(srcPdf, batch);
      copied.forEach(p => newPdf.addPage(p));
      setLoaderText(`מעתיק עמוד ${Math.min(i + BATCH, pages.length)} / ${pages.length}…`);
    }

    setLoaderText('שומר קובץ…');
    const outBytes = await newPdf.save();

    const blob = new Blob([outBytes], { type: 'application/pdf' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'daily_study.pdf'; a.click();
    URL.revokeObjectURL(url);

    hideLoader();
    showToast(`✓ הורד בהצלחה • ${pages.length} עמודים`);

  } catch (err) {
    hideLoader();
    showToast('שגיאה: ' + err.message);
    console.error(err);
  }
}

/* ══════════════════════════════════════════════════════════
   Loader helpers
══════════════════════════════════════════════════════════ */
function showLoader(text, sub) {
  setLoaderText(text); setLoaderSub(sub);
  document.getElementById('loader').style.display = 'flex';
}
function hideLoader() { document.getElementById('loader').style.display = 'none'; }
function setLoaderText(t) { document.getElementById('loader-text').textContent = t; }
function setLoaderSub(s)  { document.getElementById('loader-sub').textContent  = s; }

/* ══════════════════════════════════════════════════════════
   Toast
══════════════════════════════════════════════════════════ */
let _toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  t.style.opacity = '1';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => {
    t.style.opacity = '0';
    setTimeout(() => { t.style.display = 'none'; t.style.opacity = '1'; }, 400);
  }, 3200);
}

/* ══════════════════════════════════════════════════════════
   Utility
══════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ══════════════════════════════════════════════════════════
   Scroll indicator
══════════════════════════════════════════════════════════ */
const scrollIndicator = document.getElementById('scrollIndicator');

function handleScroll() {
  const scrollThreshold = 80;
  if (window.scrollY > scrollThreshold) {
    scrollIndicator.classList.add('scroll-hidden');
  } else {
    scrollIndicator.classList.remove('scroll-hidden');
  }
}

function scrollToContent() {
  window.scrollTo({ top: window.innerHeight, behavior: 'smooth' });
}

window.addEventListener('scroll', handleScroll, { passive: true });
handleScroll();
</script>
