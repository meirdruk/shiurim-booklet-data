name: Compute booklet data

on:
  schedule:
    # Hourly by default — cheap (a few seconds per run) and keeps the
    # cache fresh well within an hour of the source PDF being replaced.
    # Adjust freely: e.g. tighten around your actual weekly publish
    # window and loosen the rest of the week, or leave as a flat interval.
    - cron: '0 * * * 0,1'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the job can commit data.json back to the repo

concurrency:
  group: compute-booklet-data
  cancel-in-progress: false   # never cancel a run mid-write; let it finish or fail cleanly

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run compute script
        run: node scripts/compute.mjs

      - name: Commit updated data.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update precomputed booklet data [automated]"
          git push
